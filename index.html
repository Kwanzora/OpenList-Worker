<h1>OpenList-Drive</h1>
<p>OpenList-Drive 是一套个人文件同步工具。饭耳通过 WebDAV 将转写等资料传给运行在 Cloudflare Workers 上的 OpenList，由 OpenList 写入部署者自己的 Google Drive。Google OAuth 用于授权 OpenList 访问网盘。</p>
<p>本部署供部署者本人使用。关于访问权限、文件流向和撤销授权的方式，请阅读<a href="./privacy.html">隐私政策</a>。</p>
